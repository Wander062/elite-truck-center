services:
  - type: web
    name: elite-truck-center
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NOME
        value: Administrador
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_SENHA
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elite-truck-db
          property: connectionString

databases:
  - name: elite-truck-db
    plan: free
    region: ohio
    databaseName: oficina_pecas
